<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAPC: Gold Average Price Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8f8fb;
            padding: 30px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .btn-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-add { background: #409eff; color: #fff; }
        .btn-calc { background: #67c23a; color: #fff; }
        .btn-calc:disabled { background: #c2e7b0; cursor: not-allowed; }
        .btn-export { background: #e6a23c; color: #fff; }
        .btn-import { background: #909399; color: #fff; }

        .filter-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .bank-filter, .layout-filter {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bank-filter label, .layout-filter label { font-size: 14px; }
        .bank-filter select, .layout-filter select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .avg-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .avg-item {
            background: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            font-size: 14px;
        }
        .avg-item b {
            color: #e6a23c; font-weight: bold;
        }

        .records {
            width: 100%;
            margin: 0 auto 15px;
        }
        .record-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .record-index {
            width: 32px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }
        .record-item.sold {
            opacity: 0.4;
            background: #f1f1f1;
        }
        .record-item input {
            padding: 7px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            width: 120px;
        }
        .action-btn {
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .sell-btn { background: #f56c6c; color: white; }
        .del-btn { background: #909399; color: white; }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .bank-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 16px;
            width: 220px;
            flex-shrink: 0;
            text-align: left;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #409eff;
            margin-bottom: 4px;
            padding-bottom: 6px;
        }
        .card-avg {
            font-size: 13px;
            color: #e6a23c;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .card-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #eee;
            gap:8px;
        }
        .card-item.sold { opacity: 0.4; }
        .card-item-line {
            font-size: 12px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 2px;
        }
        .card-info{
            flex:1;
        }
        .card-btns {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width:44px;
        }
        .card-btn {
            padding: 3px 0;
            font-size: 11px;
            border: none;
            border-radius: 3px;
            color: #fff;
            cursor: pointer;
        }
        .card-sell { background: #f89898; }
        .card-del { background: #b4b6ba; }
        
        .card-add-row {
            margin-top: 8px;
            text-align: center;
        }
        .card-add-btn {
            width: 100%;
            padding: 4px 0;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            background: #a0d9ff;
            color: #fff;
            cursor: pointer;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 15px;
        }
        .page-btn {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .page-btn.active {
            background: #409eff;
            color: #fff;
            border-color: #409eff;
        }

        .list-mode .card-container { display: none !important; }
        .card-mode .records, .card-mode .pagination { display: none !important; }

        #fileInput { display: none; }

        /* 已锁定(新增成功)的字段样式 */
        .record-item input.locked-field,
        .card-input.locked-field {
            background: #f5f7fa;
            color: #909399;
            cursor: not-allowed;
        }

        /* 卡片内可编辑输入框：标签列、输入列、单位列宽度固定，四行输入框大小一致 */
        .card-info {
            flex: 1;
            min-width: 0;
        }
        .card-field {
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr) 36px;
            align-items: center;
            column-gap: 2px;
            font-size: 12px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 3px;
            white-space: nowrap;
        }
        .card-field .lbl, .card-field .unit { overflow: hidden; }
        .card-field .unit { color: #666; }
        .card-input {
            width: 100%;
            height: 22px;
            padding: 2px 4px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .card-input[type=number] { -moz-appearance: textfield; appearance: textfield; }
        .card-input::-webkit-outer-spin-button,
        .card-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .card-btns { flex-shrink: 0; justify-content: center; }
    </style>
</head>
<body>
    <div class="container list-mode" id="mainContainer">
        <h1 class="title">GAPC: Gold Average Price Calculator</h1>

        <div class="btn-row">
            <button class="btn btn-add" id="addRecord">新增数据</button>
            <button class="btn btn-calc" id="calcBtn">计算均价</button>
            <button class="btn btn-export" id="exportBtn">导出数据</button>
            <button class="btn btn-import" id="importBtn">导入数据</button>
            <input type="file" id="fileInput" accept=".json">
        </div>

        <div class="filter-row">
            <div class="bank-filter">
                <label>选择银行：</label>
                <select id="bankSelect">
                    <option value="all">全部银行</option>
                </select>
            </div>
            <div class="layout-filter">
                <label>选择布局：</label>
                <select id="layoutSelect">
                    <option value="list">条目布局</option>
                    <option value="card">卡片布局</option>
                </select>
            </div>
        </div>

        <div class="avg-bar" id="avgBar"></div>
        <div class="records" id="recordsContainer"></div>
        <div class="card-container" id="cardContainer"></div>
        <div class="pagination" id="pagination"></div>
    </div>

<script>
    const pageSize = 10;
    let currentPage = 1;
    let currentMode = 'list';
    const calcBtn = document.getElementById('calcBtn');
    const addRecordBtn = document.getElementById('addRecord');

    window.onload = () => {
        if (recordsContainer.children.length === 0) {
            addRecord();
        }
        bindEvents();
        updateBtnVisibility(currentMode);
        refreshAll();
    };

    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function bindEvents() {
        document.getElementById('addRecord').onclick = () => {
            // 修复1：若当前选中了某个银行，新增条目自动归属该银行
            const filterBank = bankSelect.value;
            addRecord(filterBank && filterBank !== 'all' ? { bank: filterBank } : {});
            // 跳转到新条目所在的最后一页
            currentPage = Math.max(1, Math.ceil(getFilteredRecords().length / pageSize));
            refreshAll();
        };
        document.getElementById('calcBtn').onclick = calculateAvg;
        document.getElementById('exportBtn').onclick = exportData;
        document.getElementById('importBtn').onclick = () => fileInput.click();
        document.getElementById('fileInput').onchange = importData;

        document.getElementById('bankSelect').onchange = () => {
            currentPage = 1;
            renderList();
            renderCard();
            refreshAvgDynamic();
        };

        document.getElementById('layoutSelect').onchange = function() {
            switchMode(this.value);
        };
    }

    function updateBtnVisibility(mode) {
        if (mode === 'list') {
            addRecordBtn.style.display = 'inline-block';
            calcBtn.style.display = 'inline-block';
        } else {
            addRecordBtn.style.display = 'none';
            calcBtn.style.display = 'none';
        }
    }

    function switchMode(mode) {
        currentMode = mode;
        mainContainer.className = 'container ' + mode + '-mode';
        renderList();
        renderCard();
        updateBtnVisibility(mode);

        if (mode === 'card') {
            document.getElementById('avgBar').style.display = 'none';
            calcBtn.disabled = true;
        } else {
            calcBtn.disabled = false;
        }
    }

    /* ---------- 锁定逻辑（修复2） ----------
       条目“新增成功”的判定：银行名称非空，且克数>0、总金额>0。
       满足后，买入金价 / 克数 / 总金额 变为只读，仅银行名称和备注可继续修改。 */
    const LOCK_FIELDS = ['price', 'gram', 'worth'];

    function isRecordValid(div) {
        const bank = div.querySelector('.bank').value.trim();
        const gram = parseFloat(div.querySelector('.gram').value) || 0;
        const worth = parseFloat(div.querySelector('.worth').value) || 0;
        return !!bank && gram > 0 && worth > 0;
    }

    function lockRecord(div) {
        div.dataset.locked = '1';
        LOCK_FIELDS.forEach(f => {
            const inp = div.querySelector('.' + f);
            inp.readOnly = true;
            inp.classList.add('locked-field');
            inp.title = '已新增成功，不可修改（如需调整请删除后重新新增）';
        });
    }

    // 返回当前是否处于锁定状态
    function tryLockRecord(div) {
        if (div.dataset.locked === '1') return true;
        if (isRecordValid(div)) {
            lockRecord(div);
            return true;
        }
        return false;
    }

    function addRecord(data = {}) {
        const c = recordsContainer;
        const div = document.createElement('div');
        div.className = 'record-item';
        if (data.sold) div.classList.add('sold');

        div.innerHTML = `
            <div class="record-index">${c.children.length+1}</div>
            <input type="text" class="bank" placeholder="银行" value="${escapeHtml(data.bank)}" required>
            <input type="number" class="price" placeholder="买入金价" step="0.01" value="${escapeHtml(data.price)}">
            <input type="number" class="gram" placeholder="克数" step="0.01" value="${escapeHtml(data.gram)}" required>
            <input type="number" class="worth" placeholder="总金额" step="0.01" value="${escapeHtml(data.worth)}" required>
            <input type="text" class="remark" placeholder="备注" value="${escapeHtml(data.remark)}">
            <button class="action-btn sell-btn">卖出</button>
            <button class="action-btn del-btn">删除</button>
        `;

        c.appendChild(div);

        div.querySelector('.sell-btn').onclick = () => {
            div.classList.toggle('sold');
            refreshAll();
        };
        div.querySelector('.del-btn').onclick = () => {
            div.remove();
            refreshAll();
        };
        div.querySelectorAll('input').forEach(i => {
            i.oninput = refreshAll;
        });
        // 输入完成（失焦/回车）后判断是否新增成功并锁定
        ['bank', 'price', 'gram', 'worth'].forEach(f => {
            div.querySelector('.' + f).onchange = () => tryLockRecord(div);
        });

        // 导入的、或已填写完整的数据直接锁定
        tryLockRecord(div);
    }

    function getFilteredRecords() {
        const filterBank = bankSelect.value;
        return Array.from(document.querySelectorAll('.record-item')).filter(it => {
            const b = it.querySelector('.bank').value.trim();
            return filterBank === 'all' || b === filterBank;
        });
    }

    function addRecordToBank(bankName) {
        addRecord({ bank: bankName });
        refreshAll();
    }

    function refreshAll() {
        refreshBankSelect();
        updateIndex();
        renderList();
        renderCard();
    }

    function updateIndex() {
        document.querySelectorAll('.record-item').forEach((it,i)=>{
            it.querySelector('.record-index').textContent = i+1;
        });
    }

    function refreshBankSelect() {
        const banks = new Set(['all']);
        document.querySelectorAll('.record-item').forEach(it=>{
            const b = it.querySelector('.bank').value.trim();
            if(b) banks.add(b);
        });
        const old = bankSelect.value;
        bankSelect.innerHTML = '';
        banks.forEach(b=>{
            const opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b==='all'?'全部银行':b;
            bankSelect.appendChild(opt);
        });
        bankSelect.value = banks.has(old) ? old : 'all';
    }

    function renderList() {
        if(currentMode!=='list') return;
        const list = Array.from(document.querySelectorAll('.record-item'));
        const show = getFilteredRecords();
        const total = Math.ceil(show.length/pageSize)||1;
        if (currentPage > total) currentPage = total;

        list.forEach(it=>it.style.display='none');
        const s = (currentPage-1)*pageSize;
        const e = s+pageSize;
        show.slice(s,e).forEach(it=>it.style.display='flex');

        pagination.innerHTML = '';
        for(let i=1;i<=total;i++){
            const btn = document.createElement('button');
            btn.className = 'page-btn'+(i===currentPage?' active':'');
            btn.textContent = i;
            btn.onclick = ()=>{currentPage=i;renderList();};
            pagination.appendChild(btn);
        }
    }

    function renderCard() {
        if(currentMode!=='card') return;
        const items = Array.from(document.querySelectorAll('.record-item'));
        const filterBank = bankSelect.value;
        const group = {};

        items.forEach((it, idx) => {
            const b = it.querySelector('.bank').value.trim();
            if(!b) return;
            if(filterBank !== 'all' && b !== filterBank) return;
            if(!group[b]) group[b] = [];
            group[b].push({ item: it, index: idx });
        });

        cardContainer.innerHTML = '';
        Object.entries(group).forEach(([bank, list])=>{
            const card = document.createElement('div');
            card.className = 'bank-card';
            card.dataset.bank = bank;
            const { avg } = getBankAvg(bank);
            let html = `
                <div class="card-title">${escapeHtml(bank)}</div>
                <div class="card-avg">均价：${avg} 元/克</div>
            `;
            list.forEach(({ item, index }) => {
                const sold = item.classList.contains('sold');
                const locked = item.dataset.locked === '1';
                const lockedAttr = locked ? 'readonly' : '';
                const lockedCls = locked ? ' locked-field' : '';
                const v = f => escapeHtml(item.querySelector('.' + f).value);

                // 修复3：卡片中的数据改为可编辑输入框，并同步回对应条目
                html += `
                <div class="card-item ${sold?'sold':''}" data-idx="${index}">
                    <div class="card-info">
                        <label class="card-field"><span class="lbl">金价：</span><input type="number" step="0.01" class="card-input${lockedCls}" data-field="price" value="${v('price')}" ${lockedAttr}><span class="unit">元/克</span></label>
                        <label class="card-field"><span class="lbl">克数：</span><input type="number" step="0.01" class="card-input${lockedCls}" data-field="gram" value="${v('gram')}" ${lockedAttr}><span class="unit">克</span></label>
                        <label class="card-field"><span class="lbl">金额：</span><input type="number" step="0.01" class="card-input${lockedCls}" data-field="worth" value="${v('worth')}" ${lockedAttr}><span class="unit">元</span></label>
                        <label class="card-field"><span class="lbl">备注：</span><input type="text" class="card-input" data-field="remark" placeholder="无" value="${v('remark')}"><span class="unit"></span></label>
                    </div>
                    <div class="card-btns">
                        <button class="card-btn card-sell">卖出</button>
                        <button class="card-btn card-del">删除</button>
                    </div>
                </div>`;
            });

            html += `
            <div class="card-add-row">
                <button class="card-add-btn" data-bank="${escapeHtml(bank)}">+ 新增一条数据</button>
            </div>`;

            card.innerHTML = html;
            cardContainer.appendChild(card);
        });

        bindCardBtns();
        bindCardAddBtns();
        bindCardInputs();
    }

    function bindCardInputs() {
        document.querySelectorAll('.card-item').forEach(cardItem => {
            const idx = cardItem.dataset.idx;
            const getRec = () => document.querySelectorAll('.record-item')[idx];

            cardItem.querySelectorAll('.card-input').forEach(inp => {
                // 实时同步到条目，并更新所在卡片的均价（不重绘，保持输入焦点）
                inp.oninput = () => {
                    const rec = getRec();
                    if (!rec) return;
                    rec.querySelector('.' + inp.dataset.field).value = inp.value;
                    const card = cardItem.closest('.bank-card');
                    const avgEl = card.querySelector('.card-avg');
                    avgEl.textContent = `均价：${getBankAvg(card.dataset.bank).avg} 元/克`;
                };
                // 输入完成后判断是否新增成功，成功则锁定（原地更新，不重绘，避免吞掉按钮点击）
                inp.onchange = () => {
                    const rec = getRec();
                    if (!rec) return;
                    if (tryLockRecord(rec)) {
                        cardItem.querySelectorAll('.card-input').forEach(i => {
                            if (LOCK_FIELDS.includes(i.dataset.field)) {
                                i.readOnly = true;
                                i.classList.add('locked-field');
                            }
                        });
                    }
                };
            });
        });
    }

    function bindCardBtns() {
        document.querySelectorAll('.card-sell').forEach(btn => {
            btn.onclick = function() {
                const idx = this.closest('.card-item').dataset.idx;
                const item = document.querySelectorAll('.record-item')[idx];
                item.classList.toggle('sold');
                refreshAll();
            };
        });
        document.querySelectorAll('.card-del').forEach(btn => {
            btn.onclick = function() {
                const idx = this.closest('.card-item').dataset.idx;
                const item = document.querySelectorAll('.record-item')[idx];
                item.remove();
                refreshAll();
            };
        });
    }

    function bindCardAddBtns() {
        document.querySelectorAll('.card-add-btn').forEach(btn => {
            btn.onclick = function() {
                const bank = this.dataset.bank;
                addRecordToBank(bank);
            };
        });
    }

    function getBankAvg(bank) {
        let g=0, v=0;
        const valid = [];
        document.querySelectorAll('.record-item').forEach(it=>{
            const b = it.querySelector('.bank').value.trim();
            const sold = it.classList.contains('sold');
            const gram = parseFloat(it.querySelector('.gram').value)||0;
            const worth = parseFloat(it.querySelector('.worth').value)||0;
            const price = parseFloat(it.querySelector('.price').value)||0;
            if((bank===''||b===bank) && !sold && gram>0){
                g += gram;
                v += worth;
                valid.push({price});
            }
        });
        let avg = '0.00';
        if(g>0){
            avg = valid.length===1 ? valid[0].price.toFixed(2) : (v/g).toFixed(2);
        }
        return {g,v,avg};
    }

    function calculateAvg() {
        refreshAvgDynamic();
    }

    function refreshAvgDynamic() {
        if (currentMode !== 'list') return;
        const filterBank = bankSelect.value;
        const banks = new Set();
        document.querySelectorAll('.record-item').forEach(it=>{
            const b = it.querySelector('.bank').value.trim();
            if(b) banks.add(b);
        });
        let bar = '';
        if(filterBank !== 'all') {
            const { avg } = getBankAvg(filterBank);
            bar = `<div class="avg-item">${escapeHtml(filterBank)}：<b>${avg}</b></div>`;
        } else {
            banks.forEach(b=>{
                const { avg } = getBankAvg(b);
                bar += `<div class="avg-item">${escapeHtml(b)}：<b>${avg}</b></div>`;
            });
        }
        avgBar.innerHTML = bar;
        avgBar.style.display = 'flex';
    }

    function exportData() {
        const data = Array.from(document.querySelectorAll('.record-item')).map(it=>({
            bank: it.querySelector('.bank').value.trim(),
            price: it.querySelector('.price').value.trim(),
            gram: it.querySelector('.gram').value.trim(),
            worth: it.querySelector('.worth').value.trim(),
            remark: it.querySelector('.remark').value.trim(),
            sold: it.classList.contains('sold')
        }));
        const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '黄金数据_'+new Date().toLocaleDateString()+'.json';
        a.click();
    }

    function importData(e) {
        const f = e.target.files[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = ev=>{
            try{
                const d = JSON.parse(ev.target.result);
                recordsContainer.innerHTML = '';
                d.forEach(item=>addRecord(item));
                currentPage = 1;
                refreshAll();
                alert('导入成功');
            }catch(e){alert('JSON格式错误')}
        };
        r.readAsText(f);
        e.target.value = '';
    }
</script>
</body>
</html>
